name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_api_check:
        description: Run a minimal OpenAI request using the repository secret
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    # PR branches run through pull_request; pushes validate the current default
    # branch without hard-coding the template owner's branch name.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

  live-api:
    if: github.event_name == 'workflow_dispatch' && inputs.live_api_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - run: node scripts/smoke-openai.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
