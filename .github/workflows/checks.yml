name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_api_check:
        description: Run a minimal OpenAI request using the repository secret
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build

  live-api:
    if: github.event_name == 'workflow_dispatch' && inputs.live_api_check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/smoke-openai.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
