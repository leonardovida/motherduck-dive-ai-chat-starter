name: Deploy templates

# Checks the AWS, Google Cloud and Azure deployment files without cloud credentials or cloud
# calls: the CDK app synthesizes, the committed CloudFormation and ARM templates match their
# sources, and the Terraform configuration and setup scripts are valid. See docs/deploy.md.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aws:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: deploy/aws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: deploy/aws/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npx cdk synth --quiet
        env:
          CDK_DISABLE_CLI_TELEMETRY: 'true'
      - name: The committed CloudFormation template matches the CDK app
        run: npm run check:template
      # W3005 (a redundant DependsOn that CDK writes) is a warning, so only errors fail the job.
      - name: Lint the CloudFormation template
        run: pipx run --spec cfn-lint==1.59.0 cfn-lint --non-zero-exit-code error -- cloudformation.template.json

  azure:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BICEP_VERSION: v0.48.1
      BICEP_SHA256: b09ec25a9d376c1f8e33ede6ed22b587f915ad68488d5db77a6f9541748c7f6e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Bicep
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bicep" "https://github.com/Azure/bicep/releases/download/$BICEP_VERSION/bicep-linux-x64"
          echo "$BICEP_SHA256  $RUNNER_TEMP/bicep" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bicep"
      - name: Bicep lint reports no errors or warnings
        run: |
          output="$("$RUNNER_TEMP/bicep" lint deploy/azure/main.bicep 2>&1)" || { echo "$output"; exit 1; }
          if [ -n "$output" ]; then echo "$output"; exit 1; fi
      - name: azuredeploy.json matches main.bicep
        run: |
          $RUNNER_TEMP/bicep build deploy/azure/main.bicep --outfile "$RUNNER_TEMP/azuredeploy.json"
          if ! diff -u deploy/azure/azuredeploy.json "$RUNNER_TEMP/azuredeploy.json"; then
            echo "::error::azuredeploy.json is out of date. Run: bicep build deploy/azure/main.bicep --outfile deploy/azure/azuredeploy.json (Bicep $BICEP_VERSION)"
            exit 1
          fi
      - name: The parameters file in docs/deploy.md compiles against main.bicep
        env:
          MOTHERDUCK_APP_TOKEN: ci-placeholder
          MOTHERDUCK_EMBED_TOKEN: ci-placeholder
        run: |
          awk '/^cat > deploy\/azure\/dive-chat.bicepparam <</{found=1; next} /^EOF$/{found=0} found' docs/deploy.md > deploy/azure/dive-chat.bicepparam
          test -s deploy/azure/dive-chat.bicepparam
          $RUNNER_TEMP/bicep build-params deploy/azure/dive-chat.bicepparam --outfile "$RUNNER_TEMP/dive-chat.parameters.json"
      - name: The Deploy to Azure buttons open azuredeploy.json, and every parameter has a description
        run: |
          for file in README.md docs/deploy.md; do
            grep -q 'portal.azure.com/#create/Microsoft.Template/uri/https%3A%2F%2Fraw.githubusercontent.com%2F.*%2FHEAD%2Fdeploy%2Fazure%2Fazuredeploy.json' "$file" \
              || { echo "::error file=$file::The Deploy to Azure button does not point to deploy/azure/azuredeploy.json"; exit 1; }
          done
          node -e '
            const template = JSON.parse(require("fs").readFileSync("deploy/azure/azuredeploy.json", "utf8"));
            const missing = Object.entries(template.parameters).filter(([, p]) => !p.metadata?.description).map(([name]) => name);
            if (missing.length) { console.error(`Parameters without a description: ${missing.join(", ")}`); process.exit(1); }
          '

  gcp:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deploy/gcp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - run: terraform -chdir=terraform fmt -check -diff
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform validate
      - run: shellcheck scripts/*.sh button/*.sh
      - run: node -e 'JSON.parse(require("fs").readFileSync("app.json", "utf8"))'
